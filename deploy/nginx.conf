# ---------------------------------------------------------------
# FarAlpha VM Challenge - Nginx site configuration
# ---------------------------------------------------------------
# Installed to: /etc/nginx/sites-available/faralpha-api.conf
# Enabled via:  /etc/nginx/sites-enabled/faralpha-api.conf (symlink)
#
# Nginx listens on port 80 and proxies inbound requests to Gunicorn
# bound to 127.0.0.1:8000. Gunicorn is NEVER exposed to the public
# internet directly.
# ---------------------------------------------------------------

# Upstream definition - Gunicorn on loopback only.
upstream faralpha_gunicorn {
    server 127.0.0.1:8000 fail_timeout=5s;
    keepalive 16;
}

# HTTP server - listens on port 80 (the assignment requirement).
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Server name - accept requests by IP or hostname.
    server_name _;

    # Access logs - journald captures stdout, this is the per-site log.
    access_log /var/log/nginx/faralpha-api-access.log;
    error_log  /var/log/nginx/faralpha-api-error.log;

    # Max request size - small JSON payloads only.
    client_max_body_size 64k;

    # Connection upgrades handling (for future WebSocket use).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarded headers so the app sees the real client.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Timeouts - fail fast if Gunicorn is unresponsive.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # The required application route.
    location = /sayHello {
        proxy_pass http://faralpha_gunicorn;
    }

    # Health endpoint used by the smoke test.
    location = /healthz {
        proxy_pass http://faralpha_gunicorn;
    }

    # Default: return 404 for any other path (do not expose internals).
    location / {
        return 404;
    }

    # Friendly 404 / 502 pages so the API stays JSON-shaped.
    error_page 404 = @json_404;
    error_page 502 503 504 = @json_502;

    location @json_404 {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location @json_502 {
        default_type application/json;
        return 502 '{"error":"bad_gateway"}';
    }
}
